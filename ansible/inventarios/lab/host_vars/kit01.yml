---
# En el laboratorio, cloud-init fija los nombres wan0 y lan0 por MAC
iface_wan: wan0
iface_lan: lan0
comun_admin_grupos_extra: []
comun_ufw: false
node_exporter_escucha: 127.0.0.1:9100

# WAN del laboratorio por DHCP en kitlab-uplink; las NIC se nombran por MAC
wan:
  dhcp4: true
  mac: "52:54:00:4b:01:01"
lan_mac: "52:54:00:4b:01:02"
# La máquina anfitriona hace de NetBird: el SSH de administración entra por wan0
kit01_firewall_if_netbird: wan0
# Sin NetBird en el laboratorio: los roles de red no revisan su estado
kit01_netbird: false

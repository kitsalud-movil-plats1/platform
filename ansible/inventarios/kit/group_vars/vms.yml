---
# Las VMs solo aceptan SSH desde kit01 (D-18) y tienen ufw (sección 10.1).
comun_ufw: true
comun_ufw_ssh_origenes:
  - "{{ redes.servidores.gw4 }}"
  - "{{ servicios_kit01.ipv4 }}"
  - "{{ redes.servidores.gw6 }}"
  - "{{ servicios_kit01.ipv6 }}"
  - "{{ gw_link_local }}"
# Salto por kit01. sshpass lee la contraseña de ~/.config/kitsalud/ssh-pass
# (playbooks/preparar-control.yml); la de la VM la pone Ansible desde el vault.
ansible_ssh_common_args: >-
  -o StrictHostKeyChecking=accept-new
  -o ProxyCommand="sshpass -f {{ lookup('env', 'HOME') }}/.config/kitsalud/ssh-pass
  ssh -o StrictHostKeyChecking=accept-new -W %h:%p {{ admin_usuario }}@{{ hostvars['kit01'].ansible_host }}"

---
# Puertos de administración de sw01, con el nombre que informa en la opción 82
# (Remote-ID). Cualquier equipo conectado ahí recibe una dirección del pool de
# administración.
dhcp_puertos_admin: ["ether4-interna"]
# Pool de administración, dentro de admin_ipv4_rango. La .29 queda libre para
# una dirección fija a mano si el DHCP falla
dhcp_pool_admin: 10.20.10.10 - 10.20.10.28
# Préstamo corto, para que el pool se libere al cambiar de equipo (1 h)
dhcp_prestamo_admin: 3600

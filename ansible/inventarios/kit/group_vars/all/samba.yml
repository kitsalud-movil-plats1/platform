---
# Dominio de Samba AD en clinica01 (R10, D-05, sección 9). Las contraseñas
# están en el vault; aquí solo los nombres.
samba_realm: AD.SALUD.MOVIL
samba_dominio: SALUD
samba_netbios: DC01
samba_dc_fqdn: "dc01.{{ samba_realm | lower }}"
samba_admin_password: "{{ vault_samba_admin_password }}"
samba_usuarios_password: "{{ vault_samba_usuarios_password }}"

# Grupos y usuarios individuales de prueba (D-18). El gid y el uid son fijos
# (RFC2307) para que los dueños de los archivos de los recursos SMB sean los
# mismos si el dominio se reconstruye y se restaura un backup (P11).
samba_grupos:
  - { nombre: clinicos, gid: 10001 }
  - { nombre: admins, gid: 10002 }
samba_usuarios:
  - { nombre: ana.rojas, nombres: Ana, apellidos: Rojas, uid: 10101, grupos: [clinicos] }
  - { nombre: carlos.perez, nombres: Carlos, apellidos: Perez, uid: 10102, grupos: [clinicos] }
  - { nombre: laura.gomez, nombres: Laura, apellidos: Gomez, uid: 10103, grupos: [admins] }

# Política de contraseñas. Sin complejidad ni vencimiento por las credenciales
# académicas (R-14); bloqueo de 15 minutos después de 5 intentos fallidos.
samba_politica:
  complexity: "off"
  min-pwd-length: 8
  history-length: 5
  min-pwd-age: 0
  max-pwd-age: 0
  account-lockout-threshold: 5
  account-lockout-duration: 15
  reset-account-lockout-after: 15

# Recursos SMB en el disco de datos (R9, platform#9). El primer grupo es el
# dueño de la carpeta; todos los grupos de la lista leen y escriben.
samba_recursos_raiz: /srv/samba
samba_recursos:
  - nombre: archivos
    descripcion: Documentos y exportaciones del personal clínico
    grupos: [clinicos]
    cifrado: required
    carpetas: []
  - nombre: contenido
    descripcion: Medios y ZIM que se publican en comunidad01
    grupos: [clinicos, admins]
    cifrado: desired
    carpetas: [zim, salud, comunidad]

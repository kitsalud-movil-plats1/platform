---
# Monitoreo en kit01 (D-09, observability#1). Prometheus, blackbox y el
# node_exporter de kit01 escuchan solo en localhost.
monitoreo_prometheus: 127.0.0.1:9090
monitoreo_blackbox: 127.0.0.1:9115

# node_exporter de las VMs. Se lee por IPv4 para no duplicar las series; el
# IPv6 de cada VM lo cubren las sondas.
monitoreo_nodos:
  - { nombre: clinica01, ipv4: "{{ equipos.clinica01.ipv4 }}" }
  - { nombre: comunidad01, ipv4: "{{ equipos.comunidad01.ipv4 }}" }

# Direcciones con las que kit01 llega a las VMs (F-14). Hacia br-srv sale con
# .1 en IPv4 y ::10 en IPv6; se abren las cuatro, como el SSH.
monitoreo_origenes:
  - "{{ redes.servidores.gw4 }}"
  - "{{ servicios_kit01.ipv4 }}"
  - "{{ redes.servidores.gw6 }}"
  - "{{ servicios_kit01.ipv6 }}"

# Sondas blackbox desde kit01, en IPv4 y en IPv6 salvo el AP. Las web y TCP van
# a la IP de cada familia con el nombre en Host y SNI, porque kit01 resuelve
# con los DNS del sitio; el nombre lo comprueban las sondas DNS contra BIND9.
monitoreo_dns_servidores: ["{{ servicios_kit01.ipv4 }}", "{{ servicios_kit01.ipv6 }}"]
monitoreo_dns_consultas:
  - { nombre: "pacientes.{{ dominio }}", tipo: A, respuesta: "{{ equipos.clinica01.ipv4 }}" }
  - { nombre: "pacientes.{{ dominio }}", tipo: AAAA, respuesta: "{{ equipos.clinica01.ipv6 }}" }
  # Comprueba la delegación de ad.salud.movil a Samba AD
  - { nombre: "dc01.ad.{{ dominio }}", tipo: A, respuesta: "{{ equipos.clinica01.ipv4 }}" }
# equipo es una entrada de equipos (red.yml); se sondea cada familia que tenga
monitoreo_web:
  - { nombre: pacientes, esquema: https, ruta: /api/ping, equipo: clinica01 }
  - { nombre: registro, esquema: https, ruta: /, equipo: comunidad01 }
  - { nombre: biblioteca, esquema: http, ruta: /, equipo: comunidad01 }
  - { nombre: ca, esquema: http, ruta: /, equipo: comunidad01 }
monitoreo_tcp:
  - { nombre: smb, puerto: 445, equipo: clinica01 }
  - { nombre: postgresql, puerto: 5432, equipo: clinica01 }
monitoreo_icmp: [sw01, ap01, clinica01, comunidad01]

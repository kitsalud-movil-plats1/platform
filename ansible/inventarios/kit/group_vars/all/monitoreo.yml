---
# Monitoreo en kit01 (D-09, observability#1). Prometheus, blackbox y el
# node_exporter de kit01 escuchan solo en localhost.

# node_exporter de las VMs. Se lee por IPv4 para no duplicar las series; el
# IPv6 de cada VM lo cubren las sondas.
monitoreo_nodos:
  - { nombre: clinica01, ipv4: "{{ equipos.clinica01.ipv4 }}" }
  - { nombre: comunidad01, ipv4: "{{ equipos.comunidad01.ipv4 }}" }

# Direcciones con las que kit01 llega a las VMs (F-14). Hacia br-srv sale con
# .1 en IPv4 y ::10 en IPv6; se abren las cuatro, como el SSH.
monitoreo_origenes:
  - "{{ redes.servidores.gw4 }}"
  - "{{ servicios_kit01.ipv4 }}"
  - "{{ redes.servidores.gw6 }}"
  - "{{ servicios_kit01.ipv6 }}"

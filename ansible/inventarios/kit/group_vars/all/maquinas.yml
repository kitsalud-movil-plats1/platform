---
# VMs del kit (D-19, sección 10.1). MAC fija para que cada VM conserve su
# identidad si se mueve a otro equipo (10.4).
maquinas_virtuales:
  - nombre: clinica01
    vcpu: 4
    ram_mb: 7168
    disco_sistema: 40G
    disco_datos: 120G
    mac: "52:54:00:20:00:11"
    ipv4: "{{ equipos.clinica01.ipv4 }}"
    ipv6: "{{ equipos.clinica01.ipv6 }}"
    autostart: true
  - nombre: comunidad01
    vcpu: 2
    ram_mb: 2560
    disco_sistema: 20G
    disco_datos: 120G
    mac: "52:54:00:20:00:12"
    ipv4: "{{ equipos.comunidad01.ipv4 }}"
    ipv6: "{{ equipos.comunidad01.ipv6 }}"
    autostart: true
  # VM de prueba en la Comunidad (D-24): hace de celular de la VLAN 40.
  # Solo se enciende durante las pruebas (playbooks/prueba01.yml).
  - nombre: prueba01
    vcpu: 1
    ram_mb: 512
    disco_sistema: 10G
    mac: "52:54:00:40:00:50"
    red: comunidad
    direccion: dhcp
    autostart: false
    # Hasta tener DHCP solo tiene link-local; se llega desde kit01 por br-com
    ssh_espera: "fe80::5054:ff:fe40:50%br-com"
    ssh_claves: [prueba01]

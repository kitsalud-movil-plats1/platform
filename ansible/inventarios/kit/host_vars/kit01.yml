---
# Nombres del kernel de cada rol de interfaz (D-14, R-08)
iface_wan: enp170s0
iface_lan: enp171s0
# kit01 es el hipervisor (platform#2)
comun_admin_grupos_extra: [libvirt, kvm]
# En kit01 filtra nftables (network#4); ufw no se toca
comun_ufw: false
# node_exporter de kit01 solo en localhost (observability#1)
node_exporter_escucha: 127.0.0.1:9100

# WAN del sitio (uplink del laboratorio, docs#26). Cambia según el lugar, por
# eso no está en red.yml. Sin RA del uplink (8.3)
wan:
  ipv4: 192.168.160.69/24
  gw4: 192.168.160.1
  dns: [192.168.215.20, 192.168.215.30]

# Firewall (network#10). Más tiempo antes de restaurar, para las comprobaciones:
# sondas de Prometheus y los dos flujos entre las VMs (F-11, F-12)
kit01_firewall_restauracion: 300
kit01_firewall_sondas: true
kit01_firewall_comprobaciones:
  - nombre: formularios hacia PostgreSQL (F-11)
    equipo: comunidad01
    comando: >-
      timeout 5 bash -c '</dev/tcp/{{ equipos.clinica01.ipv4 }}/5432' &&
      timeout 5 bash -c '</dev/tcp/{{ equipos.clinica01.ipv6 }}/5432'
  - nombre: publicación hacia comunidad01 (F-12)
    equipo: clinica01
    comando: >-
      timeout 5 bash -c '</dev/tcp/{{ equipos.comunidad01.ipv4 }}/22' &&
      timeout 5 bash -c '</dev/tcp/{{ equipos.comunidad01.ipv6 }}/22'

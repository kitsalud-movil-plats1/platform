---
# Caddy en clinica01: HTTPS solo desde la Interna (F-05)
caddy_origenes: ["{{ redes.interna.ipv4 }}", "{{ redes.interna.ipv6 }}"]
caddy_puertos: ["443"]

# Nombres que puede firmar el intermedio de la CA del kit en clinica01 (apps#3).
# dc01.ad es el certificado LDAPS de Samba AD (observability#2).
ca_nombres: [pacientes, consultas, archivos, dc01.ad]
ca_hojas_vm:
  - { nombre: dc01.ad, servicio: samba-ad-dc }

# Sondas blackbox desde kit01 hacia DHIS2 y SMB (F-14). El 5432 lo publica
# Docker sin pasar por ufw y lo filtra pg_hba.conf.
monitoreo_puertos: ["443", "445"]

# Autenticación de Samba hacia el log central (observability#3). La ruta es
# samba_log_auth del rol samba_ad.
comun_rsyslog_archivos:
  - { ruta: /var/log/samba/auth.log, etiqueta: samba-auth, facilidad: authpriv }

---
# Caddy en comunidad01: HTTP y HTTPS desde la Interna (F-07) y la Comunidad (F-09).
# La autorización del portal la hace nftables en kit01; ufw es la segunda barrera.
caddy_origenes:
  - "{{ redes.interna.ipv4 }}"
  - "{{ redes.interna.ipv6 }}"
  - "{{ redes.comunidad.ipv4 }}"
  - "{{ redes.comunidad.ipv6 }}"
caddy_puertos: ["80", "443"]

# Nombres que puede firmar el intermedio de la CA del kit en comunidad01 (apps#3)
ca_nombres: [registro]
# Publica la raíz en http://ca.salud.movil (Caddyfile de comunidad01)
ca_publicar: true

# Sondas blackbox desde kit01 hacia la biblioteca, la CA y el registro (F-14)
monitoreo_puertos: ["80", "443"]

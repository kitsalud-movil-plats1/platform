---
# VMs del kit (platform#7): primero se crean en kit01 y después se les aplica el rol comun
- name: Crear las VMs en kit01
  hosts: kit
  become: true
  roles:
    - kit01_vms

- name: Base común de las VMs
  hosts: vms
  become: true
  pre_tasks:
    - name: Esperar a que cloud-init termine el primer arranque
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false
  roles:
    - comun

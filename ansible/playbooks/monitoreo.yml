---
# Monitoreo del kit (observability#1, D-09): node_exporter en kit01 y en las
# VMs (con ufw para kit01) y Prometheus con las sondas blackbox en kit01
- name: node_exporter en kit01 y en las VMs
  hosts: kit:vms
  become: true
  roles:
    - node_exporter

- name: Prometheus y las sondas blackbox en kit01
  hosts: kit
  become: true
  roles:
    - blackbox_exporter
    - prometheus

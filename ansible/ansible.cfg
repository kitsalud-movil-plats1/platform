# Se usa ejecutando Ansible desde platform/ansible/ (ver README.md).
# Las rutas relativas se resuelven desde este archivo; los roles de los demás
# repositorios se encuentran por la estructura del espacio de trabajo.
[defaults]
inventory = inventarios/kit
roles_path = roles:../../network/ansible/roles:../../apps/ansible/roles:../../observability/ansible/roles
vault_password_file = ~/.config/kitsalud/vault-pass
interpreter_python = auto_silent
retry_files_enabled = False

[ssh_connection]
pipelining = True

---
# BIND9 en kit01 consulta la subzona delegada (F-25) y Grafana inicia sesión
# por LDAPS (F-13). El resto de puertos del DC se abre en la tarea que los usa.
- name: DNS del dominio desde kit01
  community.general.ufw:
    rule: allow
    proto: "{{ item.1 }}"
    port: "53"
    from_ip: "{{ item.0 }}"
    comment: samba-ad dns desde kit01
  loop: "{{ samba_dns_origenes | product(['udp', 'tcp']) | list }}"

# Recursos SMB solo desde la Interna (F-05). La Comunidad ya la corta nftables
# en kit01; aquí queda una segunda barrera.
- name: SMB desde la Interna
  community.general.ufw:
    rule: allow
    proto: tcp
    port: "445"
    from_ip: "{{ item }}"
    comment: smb desde la interna
  loop: "{{ samba_smb_origenes }}"

# Login de Grafana en kit01 contra AD (F-13)
- name: LDAPS desde kit01
  community.general.ufw:
    rule: allow
    proto: tcp
    port: "636"
    from_ip: "{{ item }}"
    comment: samba-ad ldaps desde kit01
  loop: "{{ samba_ldaps_origenes }}"

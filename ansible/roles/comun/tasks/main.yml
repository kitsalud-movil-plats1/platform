---
- name: Usuario de administración compartido con sudo
  ansible.builtin.user:
    name: "{{ admin_usuario }}"
    password: "{{ vault_admin_password_hash }}"
    update_password: on_create   # nunca cambia una contraseña existente
    shell: /bin/bash
    groups: "{{ ['sudo'] + comun_admin_grupos_extra }}"
    append: true

- name: sshd sin acceso de root
  ansible.builtin.template:
    src: sshd-10-comun.conf.j2
    dest: /etc/ssh/sshd_config.d/10-comun.conf
    owner: root
    group: root
    mode: "0644"
  notify: Recargar sshd

- name: Quitar el drop-in anterior de kit01 (platform#2), reemplazado por 10-comun.conf
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/10-kit01.conf
    state: absent
  notify: Recargar sshd

- name: Zona horaria
  community.general.timezone:
    name: "{{ comun_zona_horaria }}"

- name: Directorio de drop-ins de systemd-resolved
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: comun_dns_temporal | length > 0

- name: DNS temporal (hasta BIND9 en kit01)
  ansible.builtin.template:
    src: resolved-dns-temporal.conf.j2
    dest: /etc/systemd/resolved.conf.d/dns-temporal.conf
    owner: root
    group: root
    mode: "0644"
  when: comun_dns_temporal | length > 0
  notify: Reiniciar systemd-resolved

- name: Quitar el DNS temporal cuando ya no hace falta
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d/dns-temporal.conf
    state: absent
  when: comun_dns_temporal | length == 0
  notify: Reiniciar systemd-resolved

- name: ufw con entrada denegada y SSH solo desde kit01
  when: comun_ufw | bool
  block:
    - name: Paquete ufw
      ansible.builtin.apt:
        name: ufw
        state: present

    - name: SSH desde kit01
      community.general.ufw:
        rule: allow
        proto: tcp
        port: "22"
        from_ip: "{{ item }}"
      loop: "{{ comun_ufw_ssh_origenes }}"

    - name: Política de entrada denegada y ufw activo
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming

- name: Cliente Chrony hacia kit01
  when: comun_chrony_cliente | bool
  block:
    - name: Paquete chrony con versión fija (reemplaza a systemd-timesyncd)
      ansible.builtin.apt:
        name: "chrony={{ version_chrony }}"
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Retener chrony
      ansible.builtin.dpkg_selections:
        name: chrony
        selection: hold

    - name: Solo ntp.salud.movil como fuente, sin los pools de Ubuntu
      ansible.builtin.template:
        src: chrony-cliente.conf.j2
        dest: /etc/chrony/chrony.conf
        owner: root
        group: root
        mode: "0644"
      notify: Reiniciar chrony

    - name: Quitar la fuente que usaba una versión anterior del rol
      ansible.builtin.file:
        path: /etc/chrony/sources.d/kitsalud.sources
        state: absent
      notify: Reiniciar chrony

# imfile abre los directorios padres del archivo, y el perfil de AppArmor de
# rsyslogd solo permite lo que hay dentro de /var/log/
- name: AppArmor deja a imfile abrir /, /var/ y /var/log/
  when: comun_rsyslog_reenvio | bool
  ansible.builtin.blockinfile:
    path: /etc/apparmor.d/local/usr.sbin.rsyslogd
    create: true
    owner: root
    group: root
    mode: "0644"
    marker: "# {mark} rol comun, imfile (R12)"
    block: |
      / r,
      /var/ r,
      /var/log/ r,
    state: "{{ 'present' if comun_rsyslog_archivos else 'absent' }}"
  notify:
    - Recargar el perfil de rsyslogd
    - Reiniciar rsyslog

- name: Reenvío de rsyslog hacia kit01
  when: comun_rsyslog_reenvio | bool
  ansible.builtin.template:
    src: rsyslog-90-reenvio.conf.j2
    dest: /etc/rsyslog.d/90-reenvio.conf
    owner: root
    group: root
    mode: "0644"
    # AppArmor solo deja leer a rsyslogd sus rutas; la copia no termina en .conf
    # y lleva el directorio de trabajo que fija rsyslog.conf (imfile lo necesita)
    validate: >-
      sh -c '{ echo "global(workDirectory=\"/var/spool/rsyslog\")"; cat %s; } > /etc/rsyslog.d/.validar-reenvio &&
      rsyslogd -N1 -f /etc/rsyslog.d/.validar-reenvio; r=$?; rm -f /etc/rsyslog.d/.validar-reenvio; exit $r'
  notify: Reiniciar rsyslog

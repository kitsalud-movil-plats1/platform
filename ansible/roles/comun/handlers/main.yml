---
# Los dos escuchan "Recargar sshd" y corren en este orden; si sshd -t falla,
# el play se detiene en ese host y sshd no se recarga con una configuración rota.
- name: Validar la configuración de sshd
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
  listen: Recargar sshd

- name: Recargar el servicio ssh
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded
  listen: Recargar sshd

- name: Reiniciar chrony
  ansible.builtin.systemd_service:
    name: chrony
    state: restarted

# Antes de reiniciar rsyslog, para que arranque con el perfil nuevo
- name: Recargar el perfil de rsyslogd
  ansible.builtin.command: apparmor_parser -r /etc/apparmor.d/usr.sbin.rsyslogd
  changed_when: true

- name: Reiniciar rsyslog
  ansible.builtin.systemd_service:
    name: rsyslog
    state: restarted

- name: Reiniciar systemd-resolved
  ansible.builtin.systemd_service:
    name: systemd-resolved
    state: restarted

---
# Con una CA nueva, los certificados que Caddy guardó firmados por la anterior
# se borran para que los vuelva a emitir al arrancar
- name: Renovar los certificados de Caddy
  ansible.builtin.file:
    path: "{{ caddy_dir }}/data/caddy/certificates/local"
    state: absent
  notify: Reiniciar caddy por la CA

- name: Reiniciar caddy por la CA
  ansible.builtin.command: docker compose restart caddy
  args:
    chdir: "{{ caddy_dir }}"

# Servicios de la VM que leen su certificado al arrancar (hojas_vm.yml)
- name: Reiniciar los servicios con certificados del kit
  ansible.builtin.systemd_service:
    name: "{{ item.servicio }}"
    state: restarted
  loop: "{{ ca_hojas_vm }}"
  loop_control:
    label: "{{ item.servicio }}"

---
- name: Hostname
  ansible.builtin.hostname:
    name: "{{ kit01_base_hostname }}"
    use: systemd

# Solo la línea del propio nombre; las de dc01.ad las ponen los roles grafana y samba_ad
- name: Nombre propio en /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1 {{ kit01_base_hostname }}.{{ dominio }} {{ kit01_base_hostname }}"
    owner: root
    group: root
    mode: "0644"

# Solo se asegura que estén; sin update_cache ni upgrade
- name: Paquetes de virtualización
  ansible.builtin.apt:
    name: "{{ kit01_base_paquetes }}"
    state: present

# Con virsh, sin python3-libvirt. Solo actúa si la red está activa o arranca sola
- name: Estado de la red {{ kit01_base_red_libvirt }} de libvirt
  ansible.builtin.command: virsh -c qemu:///system net-info {{ kit01_base_red_libvirt }}
  register: kit01_base_red
  changed_when: false
  check_mode: false
  failed_when: kit01_base_red.rc != 0 and 'no network with matching name' not in kit01_base_red.stderr

# command se salta en --check y escondería la diferencia; en --check se corre
# true, que no cambia nada y la informa
- name: Detener la red {{ kit01_base_red_libvirt }}
  ansible.builtin.command: "{{ 'true' if ansible_check_mode else 'virsh -c qemu:///system net-destroy ' ~ kit01_base_red_libvirt }}"
  check_mode: false
  when: kit01_base_red.stdout is search('Active:\\s+yes')
  changed_when: true

- name: Red {{ kit01_base_red_libvirt }} sin arranque automático
  ansible.builtin.command: "{{ 'true' if ansible_check_mode else 'virsh -c qemu:///system net-autostart --disable ' ~ kit01_base_red_libvirt }}"
  check_mode: false
  when: kit01_base_red.stdout is search('Autostart:\\s+yes')
  changed_when: true

# NetBird no se actualiza con el resto de paquetes: una versión nueva podría
# cortar el acceso remoto (D-21, D-23). La configuración de NetBird no se toca
- name: NetBird retenido
  ansible.builtin.dpkg_selections:
    name: netbird
    selection: hold
